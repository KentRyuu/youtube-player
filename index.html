<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube 輪播播放器</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e8eaf0;
    --muted: #8b93a7; --accent: #ff3b3b; --accent-2: #ff6b6b; --active: #2b1a1d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 380px; height: 100vh;
  }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; } }

  /* ---------- Stage ---------- */
  #stage { position: relative; background: #000; display: flex; flex-direction: column; min-height: 0; }
  #screen { position: relative; flex: 1; min-height: 240px; background: #000; }
  #screen.fs-target:fullscreen { width: 100vw; height: 100vh; }
  #player, #screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #empty {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    color: var(--muted); font-size: 15px; pointer-events: none;
  }
  #empty b { display: block; color: var(--text); font-size: 22px; margin-bottom: 8px; }

  /* overlay controls shown in fullscreen on mouse move */
  #overlay {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 24px;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    display: none; align-items: center; gap: 10px; transition: opacity .3s;
  }
  #screen:fullscreen #overlay { display: flex; }
  #screen.idle #overlay { opacity: 0; pointer-events: none; }
  #screen:fullscreen.idle { cursor: none; }
  #overlay .title { flex: 1; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* transparent layer so mouse moves over the iframe are detected in fullscreen */
  #catcher { position: absolute; inset: 0; display: none; }
  #screen:fullscreen #catcher { display: block; bottom: 90px; }

  #bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    background: var(--panel); border-top: 1px solid var(--line); flex-wrap: wrap;
  }
  #nowTitle { flex: 1; min-width: 160px; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  button {
    font: inherit; font-size: 14px; color: var(--text); background: #232834;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  button:hover { background: #2c3240; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-2); }
  button.toggle.on { background: #3a1f24; border-color: var(--accent); color: #ffb3b3; }
  button.icon { padding: 8px 10px; min-width: 40px; }

  /* ---------- Sidebar ---------- */
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside h1 { font-size: 18px; margin: 0; padding: 16px 16px 4px; }
  aside .hint { color: var(--muted); font-size: 12px; padding: 0 16px 10px; }
  #addForm { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  textarea {
    width: 100%; min-height: 90px; resize: vertical; padding: 10px; border-radius: 8px;
    background: #10131a; color: var(--text); border: 1px solid var(--line); font: inherit; font-size: 13px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  #msg { font-size: 12px; color: var(--accent-2); min-height: 16px; }
  .settings { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .settings input { width: 64px; padding: 4px 6px; background: #10131a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; }

  #list { list-style: none; margin: 0; padding: 6px 8px 16px; overflow-y: auto; flex: 1; border-top: 1px solid var(--line); }
  #list li {
    display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer;
  }
  #list li:hover { background: #1f232c; }
  #list li.active { background: var(--active); outline: 1px solid var(--accent); }
  #list img { width: 96px; height: 54px; object-fit: cover; border-radius: 4px; background: #000; flex: none; }
  #list .meta { flex: 1; min-width: 0; }
  #list .t { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #list .s { font-size: 11px; color: var(--muted); }
  #list .ops { display: flex; flex-direction: column; gap: 2px; opacity: 0; }
  #list li:hover .ops { opacity: 1; }
  #list .ops button { padding: 2px 6px; font-size: 11px; border-radius: 4px; }
  #list li.drag-over { border-top: 2px solid var(--accent); }
  .empty-list { color: var(--muted); font-size: 13px; text-align: center; padding: 24px; }
</style>
</head>
<body>

<section id="stage">
  <div id="screen" class="fs-target">
    <div id="player"></div>
    <div id="empty"><div><b>YouTube 輪播播放器</b>在右側貼上 YouTube 連結開始播放</div></div>
    <div id="catcher"></div>
    <div id="overlay">
      <button class="icon" data-act="prev" title="上一部 (P)">⏮</button>
      <button class="icon" data-act="toggle" title="播放/暫停 (空白鍵)">⏯</button>
      <button class="icon" data-act="next" title="下一部 (N)">⏭</button>
      <span class="title" id="fsTitle"></span>
      <button data-act="fullscreen" title="離開全螢幕 (F / Esc)">離開全螢幕</button>
    </div>
  </div>
  <div id="bar">
    <button class="icon" data-act="prev" title="上一部 (P)">⏮</button>
    <button class="icon" data-act="toggle" title="播放/暫停 (空白鍵)">⏯</button>
    <button class="icon" data-act="next" title="下一部 (N)">⏭</button>
    <span id="nowTitle">尚未播放</span>
    <button class="toggle on" id="loopBtn" title="播完最後一部後從頭開始">🔁 輪播</button>
    <button class="toggle" id="shuffleBtn" title="隨機播放順序">🔀 隨機</button>
    <button class="primary" data-act="fullscreen" title="全螢幕 (F)">⛶ 全螢幕</button>
  </div>
</section>

<aside>
  <h1>播放清單</h1>
  <div class="hint">支援影片、Shorts、youtu.be 短網址、播放清單 (list=) 連結；一行一個。</div>
  <form id="addForm">
    <textarea id="urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/...&#10;https://www.youtube.com/playlist?list=..."></textarea>
    <div class="row">
      <button type="submit" class="primary">加入清單</button>
      <button type="button" id="addPlayBtn">加入並全螢幕播放</button>
    </div>
    <div id="msg"></div>
  </form>
  <div class="settings">
    <label>每部最長播放 <input type="number" id="maxSec" min="0" step="5" value="0"> 秒</label>
    <span style="flex:1">（0 = 播完整部）</span>
    <button type="button" id="clearBtn">清空</button>
  </div>
  <ul id="list"></ul>
</aside>

<script>
/* ================= State ================= */
const STORE_KEY = 'yt-carousel-v1';
const state = { items: [], current: -1, loop: true, shuffle: false, maxSec: 0 };
let player = null, playerReady = false, pendingPlay = null, segTimer = null, order = [];

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ items: state.items, loop: state.loop, shuffle: state.shuffle, maxSec: state.maxSec })); } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (d) Object.assign(state, { items: d.items || [], loop: d.loop !== false, shuffle: !!d.shuffle, maxSec: d.maxSec || 0 });
  } catch (e) {}
}

/* ================= URL parsing ================= */
function parseUrl(raw) {
  const s = raw.trim();
  if (!s) return null;
  if (/^[\w-]{11}$/.test(s)) return { type: 'video', id: s };
  let u;
  try { u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); } catch (e) { return null; }
  const host = u.hostname.replace(/^(www\.|m\.|music\.)/, '');
  const list = u.searchParams.get('list');
  let vid = null;
  if (host === 'youtu.be') vid = u.pathname.slice(1).split('/')[0];
  else if (host.endsWith('youtube.com') || host === 'youtube-nocookie.com') {
    vid = u.searchParams.get('v');
    const m = u.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]{11})/);
    if (!vid && m) vid = m[1];
  } else return null;
  const start = parseTime(u.searchParams.get('t') || u.searchParams.get('start'));
  if (list && (!vid || u.pathname === '/playlist')) return { type: 'playlist', id: list };
  if (vid && /^[\w-]{11}$/.test(vid)) return { type: 'video', id: vid, start };
  if (list) return { type: 'playlist', id: list };
  return null;
}
function parseTime(t) {
  if (!t) return 0;
  if (/^\d+$/.test(t)) return +t;
  const m = t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
  return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0;
}

/* ================= Playlist UI ================= */
const $ = s => document.querySelector(s);
const listEl = $('#list');

function render() {
  listEl.innerHTML = '';
  if (!state.items.length) {
    listEl.innerHTML = '<li class="empty-list">清單是空的</li>';
  }
  state.items.forEach((it, i) => {
    const li = document.createElement('li');
    li.draggable = true;
    li.dataset.i = i;
    if (i === state.current) li.classList.add('active');
    const thumb = it.type === 'video' ? `https://i.ytimg.com/vi/${it.id}/mqdefault.jpg` : (it.thumb || '');
    li.innerHTML = `
      <img src="${thumb}" alt="" loading="lazy">
      <div class="meta">
        <div class="t"></div>
        <div class="s">${i + 1}. ${it.type === 'playlist' ? '播放清單' : '影片'}</div>
      </div>
      <div class="ops">
        <button data-op="up" title="上移">▲</button>
        <button data-op="del" title="移除">✕</button>
        <button data-op="down" title="下移">▼</button>
      </div>`;
    li.querySelector('.t').textContent = it.title || (it.type === 'playlist' ? '播放清單 ' + it.id : it.id);
    listEl.appendChild(li);
  });
  $('#loopBtn').classList.toggle('on', state.loop);
  $('#shuffleBtn').classList.toggle('on', state.shuffle);
  $('#empty').style.display = state.current >= 0 ? 'none' : '';
}

listEl.addEventListener('click', e => {
  const li = e.target.closest('li[data-i]');
  if (!li) return;
  const i = +li.dataset.i;
  const op = e.target.dataset.op;
  if (op === 'del') removeAt(i);
  else if (op === 'up') move(i, i - 1);
  else if (op === 'down') move(i, i + 1);
  else playIndex(i);
});

/* drag & drop reorder */
let dragFrom = null;
listEl.addEventListener('dragstart', e => { const li = e.target.closest('li[data-i]'); if (li) dragFrom = +li.dataset.i; });
listEl.addEventListener('dragover', e => {
  const li = e.target.closest('li[data-i]'); if (!li) return;
  e.preventDefault();
  listEl.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
  li.classList.add('drag-over');
});
listEl.addEventListener('drop', e => {
  const li = e.target.closest('li[data-i]'); if (!li || dragFrom === null) return;
  e.preventDefault(); move(dragFrom, +li.dataset.i); dragFrom = null;
});
listEl.addEventListener('dragend', () => listEl.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over')));

function move(from, to) {
  if (to < 0 || to >= state.items.length || from === to) return;
  const [it] = state.items.splice(from, 1);
  state.items.splice(to, 0, it);
  if (state.current === from) state.current = to;
  else if (from < state.current && to >= state.current) state.current--;
  else if (from > state.current && to <= state.current) state.current++;
  rebuildOrder(); save(); render();
}
function removeAt(i) {
  const wasCurrent = i === state.current;
  state.items.splice(i, 1);
  if (i < state.current) state.current--;
  rebuildOrder();
  if (wasCurrent) {
    if (state.items.length) playIndex(Math.min(i, state.items.length - 1));
    else { state.current = -1; if (playerReady) player.stopVideo(); setTitle(''); }
  }
  save(); render();
}

function addUrls(text) {
  const lines = text.split(/[\n\s,]+/).filter(Boolean);
  let added = 0, bad = [];
  const firstNew = state.items.length;
  for (const line of lines) {
    const p = parseUrl(line);
    if (p) { state.items.push(p); added++; } else bad.push(line);
  }
  $('#msg').textContent = bad.length ? `無法辨識 ${bad.length} 個連結：${bad.slice(0, 2).join('、')}${bad.length > 2 ? '…' : ''}` : (added ? `已加入 ${added} 個項目` : '');
  rebuildOrder(); save(); render();
  return added ? firstNew : -1;
}

$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const first = addUrls($('#urls').value);
  if (first >= 0) { $('#urls').value = ''; if (state.current < 0) playIndex(first); }
});
$('#addPlayBtn').addEventListener('click', () => {
  const first = addUrls($('#urls').value);
  if (first >= 0) $('#urls').value = '';
  if (state.items.length) {
    enterFullscreen();
    playIndex(first >= 0 ? first : Math.max(0, state.current));
  }
});
$('#clearBtn').addEventListener('click', () => {
  if (!state.items.length || !confirm('確定要清空播放清單？')) return;
  state.items = []; state.current = -1; order = [];
  if (playerReady) player.stopVideo();
  setTitle(''); save(); render();
});
$('#loopBtn').addEventListener('click', () => { state.loop = !state.loop; save(); render(); });
$('#shuffleBtn').addEventListener('click', () => { state.shuffle = !state.shuffle; rebuildOrder(); save(); render(); });
$('#maxSec').addEventListener('change', e => { state.maxSec = Math.max(0, +e.target.value || 0); save(); armSegmentTimer(); });

/* ================= Order / navigation ================= */
function rebuildOrder() {
  order = state.items.map((_, i) => i);
  if (state.shuffle) {
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    // keep current item first so "next" continues from here
    const k = order.indexOf(state.current);
    if (k > 0) { order.splice(k, 1); order.unshift(state.current); }
  }
}
function step(dir) {
  if (!state.items.length) return;
  if (order.length !== state.items.length) rebuildOrder();
  let pos = order.indexOf(state.current) + dir;
  if (pos >= order.length) {
    if (!state.loop) { setTitle('播放完畢'); return; }
    if (state.shuffle) { rebuildOrder(); pos = order[0] === state.current && order.length > 1 ? 1 : 0; }
    else pos = 0;
  }
  if (pos < 0) pos = state.loop ? order.length - 1 : 0;
  playIndex(order[pos]);
}
const next = () => step(1);
const prev = () => step(-1);

/* ================= YouTube player ================= */
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, fs: 0 },
    events: {
      onReady: () => { playerReady = true; if (pendingPlay !== null) { const p = pendingPlay; pendingPlay = null; playIndex(p); } },
      onStateChange: onStateChange,
      onError: e => {
        const msgs = { 2: '連結參數錯誤', 5: 'HTML5 播放錯誤', 100: '影片不存在或已設為私人', 101: '影片擁有者不允許嵌入播放', 150: '影片擁有者不允許嵌入播放', 153: '需透過 http://localhost 開啟本頁' };
        setTitle(`⚠ ${msgs[e.data] || '播放錯誤 ' + e.data}，3 秒後跳下一部`);
        clearTimeout(segTimer);
        segTimer = setTimeout(next, 3000);
      }
    }
  });
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

function playIndex(i) {
  if (i < 0 || i >= state.items.length) return;
  state.current = i;
  if (!order.includes(i) || order.length !== state.items.length) rebuildOrder();
  render(); save();
  if (!playerReady) { pendingPlay = i; return; }
  clearTimeout(segTimer);
  const it = state.items[i];
  if (it.type === 'playlist') player.loadPlaylist({ list: it.id, listType: 'playlist', index: 0 });
  else player.loadVideoById({ videoId: it.id, startSeconds: it.start || 0 });
  setTitle(it.title || '載入中…');
  scrollActiveIntoView();
}

function onStateChange(e) {
  const it = state.items[state.current];
  if (e.data === YT.PlayerState.PLAYING) {
    const d = player.getVideoData && player.getVideoData();
    if (it && d && d.title) {
      if (it.type === 'video' && it.title !== d.title) { it.title = d.title; save(); render(); }
      if (it.type === 'playlist') {
        const pl = player.getPlaylist() || [];
        const idx = player.getPlaylistIndex();
        if (!it.title) { it.title = '播放清單：' + d.title; }
        it.thumb = `https://i.ytimg.com/vi/${pl[0] || d.video_id}/mqdefault.jpg`;
        save(); render();
        setTitle(`${d.title}（清單 ${idx + 1}/${pl.length}）`);
        armSegmentTimer();
        return;
      }
      setTitle(d.title);
    }
    armSegmentTimer();
  } else if (e.data === YT.PlayerState.ENDED) {
    clearTimeout(segTimer);
    if (it && it.type === 'playlist') {
      const pl = player.getPlaylist() || [];
      if (player.getPlaylistIndex() < pl.length - 1) return; // YouTube advances inside the playlist
    }
    next();
  }
}

/* optional "max seconds per item" timer */
function armSegmentTimer() {
  clearTimeout(segTimer);
  if (!state.maxSec || !playerReady) return;
  const it = state.items[state.current];
  const played = Math.max(0, player.getCurrentTime() - ((it && it.start) || 0));
  const left = Math.max(0, state.maxSec - played) * 1000;
  segTimer = setTimeout(() => {
    if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
    if (it && it.type === 'playlist') {
      const pl = player.getPlaylist() || [];
      if (player.getPlaylistIndex() < pl.length - 1) { player.nextVideo(); return; }
    }
    next();
  }, left);
}

function togglePlay() {
  if (!playerReady) return;
  if (state.current < 0) { if (state.items.length) playIndex(order[0] ?? 0); return; }
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
}

function setTitle(t) { $('#nowTitle').textContent = t || '尚未播放'; $('#fsTitle').textContent = t || ''; }
function scrollActiveIntoView() { const a = listEl.querySelector('li.active'); if (a) a.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

/* ================= Fullscreen ================= */
const screenEl = $('#screen');
function enterFullscreen() {
  const req = screenEl.requestFullscreen || screenEl.webkitRequestFullscreen;
  if (req) req.call(screenEl).catch?.(() => {});
}
function toggleFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else enterFullscreen();
}
let idleTimer = null;
function wake() {
  screenEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => screenEl.classList.add('idle'), 2500);
}
screenEl.addEventListener('mousemove', wake);
$('#catcher').addEventListener('click', togglePlay);
$('#catcher').addEventListener('dblclick', toggleFullscreen);
document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) wake(); });

/* ================= Buttons & keyboard ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  ({ prev, next, toggle: togglePlay, fullscreen: toggleFullscreen })[b.dataset.act]();
});
document.addEventListener('keydown', e => {
  if (e.target.matches('textarea, input')) return;
  const k = e.key.toLowerCase();
  if (k === 'f') { e.preventDefault(); toggleFullscreen(); }
  else if (k === ' ' || k === 'k') { e.preventDefault(); togglePlay(); }
  else if (k === 'n' || (e.shiftKey && k === 'arrowright')) { e.preventDefault(); next(); }
  else if (k === 'p' || (e.shiftKey && k === 'arrowleft')) { e.preventDefault(); prev(); }
  else return;
  wake();
});

/* ================= Boot ================= */
load();
$('#maxSec').value = state.maxSec;
rebuildOrder();
render();
if (location.protocol === 'file:') {
  $('#msg').textContent = '⚠ 直接開檔案 (file://) YouTube 可能拒絕播放，請用 start.bat 啟動。';
}
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
</script>
</body>
</html>
